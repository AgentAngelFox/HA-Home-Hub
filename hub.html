<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Home Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap">
<style>
:root{--bg:#f4f5f3;--card:#fff;--tx:#202124;--sub:#6b6f73;--bl:#1a56db;--tint:#dbe6f7;--ye:#fdf1c9;font-size:calc(100vmin/40)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:400 1rem/1.25 "Google Sans","Product Sans",Outfit,system-ui,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;user-select:text;color:var(--tx)}
small{font-size:.85rem;color:var(--sub)}
.ic{width:1.6rem;height:1.6rem;flex:none}
.row{display:flex;justify-content:space-between;align-items:center}
.grow{flex:1}
/* header */
#top{display:flex;align-items:center;gap:2rem;padding:1rem 1.6rem .6rem;flex:none}
#ast{display:grid;grid-template-columns:.7rem .7rem;gap:.22rem;padding:.5rem}
#ast i{width:.7rem;height:.7rem;border-radius:50%}
#tabs{display:flex;gap:2.2rem;flex:1}
.tab{font-size:1.25rem;color:var(--sub);position:relative;padding:.3rem 0}
.tab.sel{color:var(--tx)}
.tab.sel::after{content:"";position:absolute;left:0;bottom:-.25rem;width:1.1rem;height:2px;background:var(--tx)}
#clk{font-size:1.25rem}
/* pager */
#pager{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
#pager::-webkit-scrollbar,#tiles::-webkit-scrollbar{display:none}
.pg{flex:none;width:100%;scroll-snap-align:start;padding:.8rem 1.6rem 3.4rem;display:flex;flex-direction:column;position:relative;min-height:0}
.pg>div:first-child{flex:1;min-height:0}
.card{background:var(--card);border-radius:1.5rem;padding:1.4rem;box-shadow:0 .1rem .5rem rgba(60,64,67,.13);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.dk{background:linear-gradient(160deg,#586a80,#38475b);color:#fff}
.bl{background:linear-gradient(170deg,#6a8fc9,#2c5ca8);color:#fff}
.dk small,.bl small{color:rgba(255,255,255,.8)}
.g2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1rem}
.big{font-size:3.6rem;font-weight:300;line-height:1}
.h2{font-size:1.7rem;line-height:1.2}
hr{border:0;border-top:1px solid rgba(255,255,255,.35);margin:.8rem 0}
/* home control */
#hc{display:flex;gap:1rem}
#cats{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:6.4rem;gap:.8rem;width:36%;flex:none;align-content:start}
.cat{background:var(--card);border-radius:1.3rem;padding:1rem;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-size:1.15rem;box-shadow:0 .1rem .5rem rgba(60,64,67,.13)}
#tiles{flex:1;display:grid;grid-auto-flow:column;grid-template-rows:1fr 1fr;grid-auto-columns:12rem;gap:.8rem;overflow-x:auto;scrollbar-width:none}
.tile{position:relative;background:var(--card);border-radius:1.4rem;padding:1rem;display:flex;flex-direction:column;box-shadow:0 .1rem .5rem rgba(60,64,67,.13)}
.tile.blu{background:var(--tint)}.tile.blu .ic{fill:var(--bl)}
.tile.ye{background:var(--ye)}.tile.ye .ic{fill:#b06f00}
.tr{display:flex;justify-content:space-between}
.tb{font-size:1.9rem;margin-top:auto}
.tn{color:var(--sub);font-size:1rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.x{position:absolute;top:.4rem;right:.4rem;background:#d93025;color:#fff;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;font-size:.9rem;font-style:normal}
.add{align-items:center;justify-content:center;font-size:1.1rem;color:var(--bl);text-align:center}
#edit{position:absolute;right:1.6rem;bottom:.8rem;background:var(--card);border-radius:2rem;padding:.5rem 1.2rem;box-shadow:0 .1rem .4rem rgba(0,0,0,.2);color:var(--bl)}
/* media + communicate */
.mc{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
#np{flex-direction:row;gap:1.2rem;align-items:center;background:linear-gradient(160deg,#7a7e82,#4b4e52);color:#fff}
.npa{width:10rem;height:10rem;flex:none;background:#e8eaed;border-radius:1rem;display:grid;place-items:center;overflow:hidden;color:#202124}
.npa img{width:100%;height:100%;object-fit:cover}
.npt{font-size:1.5rem;margin-bottom:.2rem}
#np small{color:rgba(255,255,255,.8)}
.chip{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.2);border-radius:2rem;padding:.45rem 1rem;margin:.7rem 0;font-size:.95rem}
.ctl{display:flex;gap:1.2rem;align-items:center}
.ctl .ic{width:2.2rem;height:2.2rem}
.cm{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.cm .card{justify-content:space-between;font-size:1.6rem}
.cm .ic{width:3rem;height:3rem;fill:var(--bl)}
/* lists, sheets */
.ov{position:fixed;left:0;right:0;top:0;bottom:0;background:var(--bg);transform:translateY(100%);transition:transform .28s;z-index:20;display:flex;flex-direction:column}
.ov.open{transform:none}
#sh{display:flex;align-items:center;gap:1rem;padding:1rem 1.6rem;font-size:1.4rem;flex:none}
#sb{flex:1;overflow-y:auto;padding:0 1.6rem 1.6rem;min-height:0}
.sb{display:flex;align-items:center;gap:.8rem;background:var(--card);border-radius:2rem;padding:.7rem 1.2rem;margin-bottom:.8rem}
.sb input{flex:1;border:0;outline:0;background:none;font-size:1.1rem}
.lr{display:flex;align-items:center;gap:1rem;padding:.9rem .4rem;border-top:1px solid #dadce0;font-size:1.2rem}
.li{width:2.6rem;display:grid;place-items:center}
.lm{flex:1;min-width:0}
.ob{border:1px solid #c4c7cc;border-radius:2rem;padding:.55rem 1.3rem;color:var(--bl);background:var(--card)}
.btn{background:var(--card);border-radius:2rem;padding:.8rem 1.6rem;color:var(--bl);display:inline-flex;gap:.5rem;align-items:center;font-size:1.1rem;box-shadow:0 .1rem .4rem rgba(0,0,0,.15)}
.btn.pri{background:var(--bl);color:#fff}
.bn{font-size:2.2rem;margin:1rem 0}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));grid-auto-rows:9.5rem;gap:.8rem}
.cmp textarea{width:100%;height:9rem;border:0;border-radius:1.2rem;padding:1rem;font-size:1.2rem;background:var(--card);resize:none;margin-bottom:1rem}
.bub{max-width:80%;padding:.7rem 1.1rem;border-radius:1.2rem;margin:.4rem 0;font-size:1.1rem;background:var(--card)}
.bub.me{margin-left:auto;background:var(--tint)}
.qs{display:flex;gap:.6rem;flex-wrap:wrap;margin:.8rem 0}
.qs button,.sel{border:1px solid #c4c7cc;border-radius:2rem;padding:.5rem 1.1rem;background:var(--card);font-size:1rem}
.sel.on{background:var(--tint);border-color:var(--tint);color:var(--bl)}
input[type=range]{width:100%;height:2rem;accent-color:#f9ab00}
/* drawer */
#drw{position:fixed;left:0;right:0;bottom:0;height:62%;background:var(--card);border-radius:1.8rem 1.8rem 0 0;box-shadow:0 -.3rem 1.2rem rgba(0,0,0,.25);transform:translateY(105%);transition:transform .28s;z-index:25;padding:1rem 1.8rem;overflow-y:auto}
#drw.open{transform:none}
#drw h3{font-weight:400;font-size:1.4rem;margin:.6rem 0 .2rem}
#drw select{width:100%;padding:.7rem;font-size:1.05rem;border:1px solid #c4c7cc;border-radius:.8rem;margin:.4rem 0 .8rem;background:#fff}
.grip{width:3rem;height:.3rem;border-radius:.2rem;background:#c0c3c6;margin:0 auto .4rem}
#pz{position:fixed;left:0;right:0;bottom:0;height:3rem;display:flex;justify-content:center;align-items:flex-end;padding-bottom:.6rem;z-index:5}
#pz i{width:3rem;height:.3rem;border-radius:.2rem;background:#c0c3c6}
/* weather overlay */
/* Weather changes with the live Home Assistant weather condition. No external images needed. */
#wxo{background:linear-gradient(160deg,#8fb0cc,#4a647f 55%,#2f4258);color:#fff;transition:background-color .4s;isolation:isolate}
#wxo[data-weather="sunny"]{background:radial-gradient(ellipse at 83% 8%,rgba(255,248,180,.75),transparent 39%),linear-gradient(160deg,#64b8f2,#2e83c7 60%,#17609e)}
#wxo[data-weather="partlycloudy"]{background:radial-gradient(ellipse at 80% 17%,rgba(255,237,175,.52),transparent 36%),linear-gradient(155deg,#89b6d4,#6499be 48%,#3b6d97)}
#wxo[data-weather="cloudy"]{background:radial-gradient(ellipse at 20% 14%,rgba(231,237,241,.3),transparent 46%),linear-gradient(155deg,#8294a5,#586e84 55%,#394e63)}
#wxo[data-weather="rainy"],#wxo[data-weather="pouring"]{background:repeating-linear-gradient(108deg,transparent 0px,transparent 29px,rgba(200,226,245,.11) 30px,transparent 32px),linear-gradient(155deg,#5a7a99,#334d69 56%,#20364f)}
#wxo[data-weather="snowy"],#wxo[data-weather="snowy-rainy"]{background:radial-gradient(circle at 21% 23%,rgba(255,255,255,.72) 1px,transparent 3px),radial-gradient(circle at 71% 63%,rgba(255,255,255,.7) 2px,transparent 4px),linear-gradient(155deg,#9ebbd1,#7096b6 55%,#506f91);background-size:75px 83px,112px 97px,auto}
#wxo[data-weather="clear-night"]{background:radial-gradient(circle at 77% 18%,rgba(255,255,218,.85) 0,rgba(255,255,218,.55) 2px,transparent 4px),radial-gradient(circle at 20% 35%,rgba(227,238,255,.6) 1px,transparent 2px),linear-gradient(160deg,#1c305a,#101e3c 55%,#091427);background-size:125px 115px,83px 97px,auto}
#wxo[data-weather="lightning"],#wxo[data-weather="lightning-rainy"],#wxo[data-weather="exceptional"]{background:radial-gradient(ellipse at 72% 20%,rgba(194,177,220,.28),transparent 43%),linear-gradient(155deg,#53546b,#34354f 60%,#20253d)}
#wxo[data-weather="fog"]{background:linear-gradient(170deg,rgba(245,248,251,.15),transparent 70%),linear-gradient(155deg,#a1aeb5,#788c98 55%,#536f82)}
#wxo[data-weather="windy"],#wxo[data-weather="windy-variant"]{background:repeating-linear-gradient(168deg,transparent 0px,transparent 52px,rgba(231,243,255,.08) 53px,transparent 58px),linear-gradient(155deg,#709bb8,#4d7599 55%,#294a70)}
#wxo[data-weather="hail"]{background:radial-gradient(circle at 23% 28%,rgba(248,251,255,.65) 2px,transparent 4px),linear-gradient(155deg,#7c9bb5,#526d8a 55%,#2d4665);background-size:87px 99px,auto}
#wxo small{color:rgba(255,255,255,.85)}
#wxb{position:absolute;top:1rem;left:1.2rem;z-index:2;padding:.6rem}
#wxb .ic{fill:#fff}
#wxs{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.wp{flex:none;width:100%;scroll-snap-align:start;padding:2.6rem 2.6rem 1.6rem;display:flex;flex-direction:column}
.p1{align-items:center;justify-content:center;text-align:center;font-size:1.6rem}
.huge{font-size:11rem;font-weight:300;line-height:1.1}
.hrs{display:flex;gap:2.6rem;overflow-x:auto;margin-top:auto;scrollbar-width:none}
.hr{text-align:center;flex:none;font-size:1.1rem}
.hr b{display:block;font-size:2rem;font-weight:400}
.hr span{display:block;font-size:2rem;margin:.4rem 0}
#wa{margin:1rem 0;font-size:1.2rem;min-height:1.5rem}
#wq{display:flex;gap:.8rem;overflow-x:auto;scrollbar-width:none}
#wq button{flex:none;border:2px solid rgba(255,255,255,.7);border-radius:2rem;padding:.7rem 1.4rem;font-size:1.15rem;color:#fff}
/* setup */
#setup{position:fixed;left:0;right:0;top:0;bottom:0;background:var(--bg);display:none;place-items:center;z-index:40}
#setup form{background:var(--card);border-radius:1.6rem;padding:2rem;width:min(34rem,90vw);display:grid;gap:1rem}
#setup input{padding:.9rem 1rem;border:1px solid #c4c7cc;border-radius:.8rem}
#setup button{background:var(--bl);color:#fff;border-radius:2rem;padding:.9rem;text-align:center}
</style>
</head>
<body>
<header id="top">
  <button id="ast" aria-label="Assistant"><i style="background:#4285f4"></i><i style="background:#ea4335"></i><i style="background:#fbbc04"></i><i style="background:#34a853"></i></button>
  <nav id="tabs"></nav>
  <div id="clk"></div>
</header>
<div id="pager">
  <section class="pg"><div class="g2">
    <button class="card bl" id="cr"></button><button class="card dk" id="cw"></button>
    <button class="card" id="ch"></button><div class="card" id="cc"></div>
  </div></section>
  <section class="pg"><div id="hc"><div id="cats"></div><div id="tiles"></div></div><button id="edit">Edit</button></section>
  <section class="pg"><div class="mc">
    <div class="card" id="np"></div>
    <div class="card" id="lib" style="overflow-y:auto"><div class="sb"><svg class="ic" viewBox="0 0 24 24"></svg><input id="q" type="search" placeholder="Search Music Assistant"></div><div id="res"></div></div>
  </div></section>
  <section class="pg"><div class="cm">
    <button class="card" id="bc"></button><button class="card" id="ic"></button>
  </div></section>
</div>
<div id="pz"><i></i></div>

<div class="ov" id="sheet"><div id="sh"><button id="sback"></button><span id="st"></span></div><div id="sb"></div></div>
<div class="ov" id="wxo"><button id="wxb"></button><div id="wxs"></div></div>
<div id="drw"></div>
<div id="setup" role="status" style="display:grid;place-items:center">Connecting to Home Assistant…</div>

function connect(){
  const endpoint = new URL('/api/websocket', location.href);
  endpoint.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(endpoint.href);
  ws.onclose=()=>{ $('#setup').textContent='Home Assistant is unavailable. Check the hub settings in Arcane.'; $('#setup').style.display='grid'; setTimeout(connect,4000) };
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type==='auth_ok'){ haUrl=m.ha_url; $('#setup').style.display='none'; init() }
    else if(m.type==='result'&&pend[m.id]){pend[m.id](m.result);delete pend[m.id]}
    else if(m.type==='event'){
      if(fcIds[m.id]){(fcIds[m.id]==='daily'?(fcD=m.event.forecast||[]):(fcH=m.event.forecast||[]));rr()}
      else if(m.event.event_type==='state_changed'){const d=m.event.data;if(d.new_state)S[d.entity_id]=d.new_state;else delete S[d.entity_id];if(weatherSpeechWatch)weatherSpeechWatch(d);rr()}}};
}

const cname=c=>(CT[c]||c||'').toLowerCase();

const dsum=f=>cname(f.condition)+', high '+Math.round(f.temperature)+', low '+Math.round(f.templow)+(f.precipitation_probability?', '+f.precipitation_probability+' percent chance of rain':'');
/* The first weather page is a spoken briefing. The next page opens when
   the device's TTS playback finishes (or after a bounded fallback). */
function closeWx(){
  weatherSpeechToken++;
  if(weatherSpeechWatch)weatherSpeechWatch=null;
  $('#wxo').classList.remove('open');
}
function nextWeatherPage(token){
  if(token!==weatherSpeechToken||!$('#wxo').classList.contains('open'))return;
  const p=$('#wxs');
  // Respect a manual swipe to the detailed forecast during the briefing.
  if(p.scrollLeft<p.clientWidth*.5)p.scrollTo({left:p.clientWidth,behavior:'smooth'});
}
function weatherBriefing(text,token){
  const tts=Object.keys(S).find(k=>k.indexOf('tts.')===0);
  const player=cfg.speaker&&S[cfg.speaker]?cfg.speaker:null;
  // With HA TTS we cannot use the service call response as an audio-ended event.
  // Watch the chosen media player's playing->not-playing state transition.
  if(tts&&player&&ws&&ws.readyState===WebSocket.OPEN){
    let started=false,done=false;
    const finish=()=>{if(done)return;done=true;clearTimeout(limit);if(weatherSpeechWatch===watch)weatherSpeechWatch=null;nextWeatherPage(token)};
    const watch=d=>{
      if(token!==weatherSpeechToken){finish();return}
      if(d.entity_id!==player||!d.new_state)return;
      const state=d.new_state.state;
      if(state==='playing')started=true;
      else if(started&&(state==='idle'||state==='off'||state==='paused'||state==='standby'))finish();
    };
    weatherSpeechWatch=watch;
    // Fallback for receivers that don't expose playback state or stop events.
    const limit=setTimeout(finish,45000);
    call('tts','speak',{entity_id:tts,media_player_entity_id:player,message:text});
    return;
  }
  // Browser speechSynthesis offers an actual onend event if supported.
  if(window.speechSynthesis&&window.SpeechSynthesisUtterance){
    let done=false;
    const finish=()=>{if(done)return;done=true;clearTimeout(limit);nextWeatherPage(token)};
    const limit=setTimeout(finish,30000);
    try{
      const utterance=new SpeechSynthesisUtterance(text);
      utterance.onend=finish;utterance.onerror=finish;
      speechSynthesis.speak(utterance);
    }catch(e){finish()}
    return;
  }
  // No available speech engine: don't strand the user on the intro page.
  setTimeout(()=>nextWeatherPage(token),1200);
}

  e.onclick=ev=>{if(edit)return dropDev(i);if(t.more&&ev.target.closest('.chev'))t.more();else if(t.go)t.go()};return e}
function areaIds(){const b=Object.keys(S).filter(i=>TD.indexOf(dom(i))>-1&&vis(i)&&cfg.areas.indexOf(ent2area[i])>-1&&okBS(i)&&cfg.hidden.indexOf(i)<0);
  return b.concat(cfg.extra.filter(i=>S[i]&&b.indexOf(i)<0)).sort((a,c)=>TD.indexOf(dom(a))-TD.indexOf(dom(c)))}
function drawTiles(){const T=$('#tiles'),sl=T.scrollLeft;T.innerHTML='';
  if(!cfg.areas.length){const b=E('button','tile blu add','Choose this display’s room');b.style.gridRow='1/3';b.onclick=openDrw;T.append(b);return}
  areaIds().forEach(i=>T.append(tileEl(i)));
  if(edit){const a=E('button','tile add','+ Add device');a.onclick=addDev;T.append(a)}
  T.scrollLeft=sl}
function dropDev(i){const x=cfg.extra.indexOf(i);if(x>-1)cfg.extra.splice(x,1);else cfg.hidden.push(i);save();drawTiles()}
function addDev(){const have=areaIds();listSheet('Add device',Object.keys(S).filter(i=>TD.indexOf(dom(i))>-1&&vis(i)&&okBS(i)&&have.indexOf(i)<0).sort((a,b)=>nm(a).localeCompare(nm(b))).map(i=>({ico:info(S[i]).ico,name:nm(i),sub:aName(i)||dom(i),tap:()=>{cfg.hidden=cfg.hidden.filter(x=>x!==i);if(cfg.extra.indexOf(i)<0)cfg.extra.push(i);save();closeSheet();drawTiles()}})))}

/* ---------- media (Music Assistant) ---------- */
function maPlayers(){const m=ids(['media_player']);const ma=m.filter(i=>reg[i]&&reg[i].platform==='music_assistant');return ma.length?ma:m.filter(i=>S[i].state!=='unavailable')}
function curMp(){const ps=maPlayers();return cfg.mp&&S[cfg.mp]?cfg.mp:(ps.find(p=>S[p].state==='playing')||ps[0])}
function drawNP(){const id=curMp(),N=$('#np');if(!id){N.innerHTML='<div class="h2">No media players found</div>';return}
  const s=S[id],a=s.attributes,pic=a.entity_picture?(a.entity_picture.indexOf('http')===0?a.entity_picture:haUrl+a.entity_picture):'',pl=s.state==='playing';
  N.innerHTML='<div class="npa">'+(pic?'<img src="'+pic+'">':ic('music'))+'</div><div style="min-width:0"><div class="npt">'+(a.media_title||'Nothing playing')+'</div><small>'+(a.media_artist||cap(s.state))+'</small><br><button class="chip" id="mp">'+ic('cast')+nm(id)+'</button><div class="ctl"><button id="pv">'+ic('prev')+'</button><button id="pp">'+ic(pl?'pause':'play')+'</button><button id="nx">'+ic('next')+'</button></div></div>';
  const c=(x,sv)=>{$(x).onclick=()=>call('media_player',sv,{entity_id:id})};c('#pv','media_previous_track');c('#pp','media_play_pause');c('#nx','media_next_track');
  $('#mp').onclick=()=>listSheet('Players',maPlayers().map(i=>({ico:'tv',name:nm(i),sub:cap(S[i].state),tap:()=>{cfg.mp=i;save();closeSheet();drawNP()}})))}
async function maCall(sv,d){if(maE===undefined){const r=await send({type:'config_entries/get',domain:'music_assistant'});maE=(r&&r[0]&&r[0].entry_id)||null}
  if(!maE)return null;const r=await send({type:'call_service',domain:'music_assistant',service:sv,service_data:Object.assign({config_entry_id:maE},d),return_response:true});return r&&r.response}
async function maSearch(q){const R=$('#res');R.innerHTML='<small>Loading…</small>';let items=[];
  try{if(q){const r=await maCall('search',{name:q,limit:5});if(r)['playlists','albums','tracks','artists','radio'].forEach(k=>items=items.concat(r[k]||[]))}
    else{const r=await maCall('get_library',{media_type:'playlist',limit:12,order_by:'name'});items=(r&&r.items)||[]}}catch(e){}
  R.innerHTML='';if(!items.length){R.innerHTML='<small>'+(maE===null?'Music Assistant integration not found.':'Nothing found.')+'</small>';return}
  items.forEach(r=>{const el=E('div','lr','<div class="li">'+ic('music','#5f6368')+'</div><div class="lm"><div>'+r.name+'</div><small>'+cap(r.media_type||'')+((r.artists&&r.artists.length)?' · '+r.artists.map(x=>x.name).join(', '):'')+'</small></div>');
    el.onclick=()=>call('media_player','play_media',{entity_id:curMp(),media_content_id:r.uri,media_content_type:r.media_type});R.append(el)})}

/* ---------- communicate ---------- */
const room=()=>cfg.areas.map(a=>(areas.find(x=>x.area_id===a)||{}).name).filter(Boolean).join(' and ')||'the hub';
function announce(m,tg){const tts=Object.keys(S).find(k=>k.indexOf('tts.')===0),text='Message from '+room()+'. '+m;
  if(tts&&tg.players.length)call('tts','speak',{entity_id:tts,media_player_entity_id:tg.players,message:text});
  else if(tg.sats.length)call('assist_satellite','announce',{entity_id:tg.sats,message:text})}
function compose(title,tgf){
  const b=E('div','cmp','<textarea placeholder="Type your message"></textarea><div class="qs"><button class="btn" id="mc">'+ic('mic')+' Speak</button><button class="btn pri" id="sd">Send</button></div><small id="cs"></small>'),ta=b.querySelector('textarea');
  if(!SR)b.querySelector('#mc').style.display='none';b.querySelector('#mc').onclick=()=>listen(t=>ta.value=t);
  b.querySelector('#sd').onclick=()=>{const m=ta.value.trim();if(!m)return;const tg=tgf();announce(m,tg);b.querySelector('#cs').textContent='Sent to '+(tg.players.length+(tg.players.length?0:tg.sats.length))+' device(s)';ta.value=''};
  openSheet(title,b)}
function intercom(){const dv=ids(['assist_satellite','media_player']).filter(i=>i!==cfg.speaker&&S[i].state!=='unavailable');
  listSheet('Intercom',dv.map(i=>({ico:dom(i)==='assist_satellite'?'mic':'tv',name:(aName(i)?aName(i)+' · ':'')+nm(i),sub:dom(i)==='assist_satellite'?'Voice assistant':'Speaker',tap:()=>compose(nm(i),()=>dom(i)==='assist_satellite'?{players:[],sats:[i]}:{players:[i],sats:[]})})))}

/* ---------- assistant ---------- */
function assist(){
  const b=E('div',null,'<div id="chat"></div><div class="qs"><button>What’s the weather?</button><button>Which lights are on?</button><button>Is the front door locked?</button></div><div class="sb"><input id="ai" placeholder="Ask or tell me something"><button id="am">'+ic('mic','#5f6368')+'</button><button id="as" class="ob">Send</button></div>'),chat=b.querySelector('#chat'),inp=b.querySelector('#ai');
  const bub=(t,me)=>{chat.append(E('div','bub'+(me?' me':''),t));chat.lastChild.scrollIntoView()};
  const say=async t=>{if(!t)return;bub(t,1);inp.value='';const r=await send({type:'conversation/process',text:t,language:'en',conversation_id:cid});
    const sp=r&&r.response&&r.response.speech&&r.response.speech.plain&&r.response.speech.plain.speech;cid=r&&r.conversation_id;bub(sp||'Sorry, I couldn’t reach the assistant.');if(sp)speak(sp)};
  b.querySelectorAll('.qs button').forEach(x=>x.onclick=()=>say(x.textContent));b.querySelector('#as').onclick=()=>say(inp.value.trim());
  inp.onkeydown=e=>{if(e.key==='Enter')say(inp.value.trim())};
  if(!SR)b.querySelector('#am').style.display='none';b.querySelector('#am').onclick=()=>listen(say);
  openSheet('Assistant',b)}

/* ---------- drawer (per-display settings) ---------- */
function openDrw(){const d=$('#drw'),sp=ids(['media_player']),wl=ids(['weather']);
  d.innerHTML='<div class="grip"></div><h3>Rooms on this display</h3><small>Home control shows devices from these areas.</small><div class="qs">'+areas.map(a=>'<button class="sel'+(cfg.areas.indexOf(a.area_id)>-1?' on':'')+'" data-a="'+a.area_id+'">'+a.name+'</button>').join('')+'</div>'+
   '<h3>Speaker for this display</h3><small>Used for weather and assistant replies.</small><select id="sp"><option value="">None (use this device)</option>'+sp.map(i=>'<option value="'+i+'"'+(cfg.speaker===i?' selected':'')+'>'+nm(i)+'</option>').join('')+'</select>'+
   (wl.length>1?'<h3>Weather</h3><select id="wl">'+wl.map(i=>'<option value="'+i+'"'+(wxId()===i?' selected':'')+'>'+nm(i)+'</option>').join('')+'</select>':'')+
   '<div class="qs"><button id="rl">Reload</button></div>';
  d.querySelectorAll('.sel').forEach(b=>b.onclick=()=>{const a=b.dataset.a,x=cfg.areas.indexOf(a);x>-1?cfg.areas.splice(x,1):cfg.areas.push(a);save();b.classList.toggle('on');drawTiles()});
  d.querySelector('#sp').onchange=e=>{cfg.speaker=e.target.value;save()};
  if(wl.length>1)d.querySelector('#wl').onchange=e=>{cfg.weather=e.target.value;save();location.reload()};
  d.querySelector('#rl').onclick=()=>location.reload();
  d.classList.add('open')}
connect();
</script>
